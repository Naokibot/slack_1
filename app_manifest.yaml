_metadata:
  major_version: 2
  minor_version: 1

display_information:
  name: KOSEN Assistant
  description: 高専入試カウントダウン・予定・防災通知Bot
  background_color: "#1f2937"

features:
  bot_user:
    display_name: KOSEN Assistant
    always_online: true
  slash_commands:
    - command: /kosen
      description: 高専入試までの残り日数と設定
      usage_hint: "set-date YYYY-MM-DD | set-time HH:MM"
      should_escape: false
    - command: /reminder
      description: 予定リマインダーの追加・一覧・編集・削除
      usage_hint: "add YYYY-MM-DD HH:MM 予定 | list | today | tomorrow | edit ID | delete ID"
      should_escape: false
    - command: /disaster
      description: 防災監視の状態を確認
      usage_hint: "status"
      should_escape: false
    - command: /bot-status
      description: Botの稼働状態を確認
      should_escape: false
    - command: /kosen-help
      description: Botの使い方を表示
      should_escape: false
    - command: /help
      description: Botの使い方を表示
      should_escape: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - commands

settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
