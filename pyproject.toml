[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kosen-slack-bot"
version = "0.2.0"
description = "KOSEN countdown and schedule reminders for Slack"
requires-python = ">=3.12"
dependencies = [
  "slack-bolt>=1.22,<2",
  "python-dotenv>=1.0,<2",
  "tzdata>=2025.2",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["kosen_bot*"]
